name: Compile SwimSwam Workouts to DOCX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper and Compile DOCX
        run: python scraper_to_docx.py

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SwimSwam-Workouts
          path: |
            SwimSwam_488_Workouts.docx
            failed_urls.txt
          if-no-files-found: warn
